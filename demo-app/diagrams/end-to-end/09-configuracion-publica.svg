<text font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#4B6178"><tspan x="1530" y="360.0">Resultados → .env / process.env</tspan><tspan x="1530" y="382.4">La SPA recarga /api/config</tspan></text>
<text font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#4B6178"><tspan x="72" y="484.0">Manual: cliente inicial de Management, cliente OBO, importación CIMD y habilitación de Token Vault. FGA remoto: opcional.</tspan></text>
<rect x="48" y="544" width="1824" height="368" rx="12" fill="#FBF8F2" stroke="#E5DAC6" stroke-width="1.5"/>
<text font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#AD6100"><tspan x="72" y="582.0">02  /  HTTPS PÚBLICO HACIA LOS SERVICIOS LOCALES</tspan></text>
<text font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#4B6178"><tspan x="72" y="615.0">Auth0 debe alcanzar los endpoints públicos. El túnel hacia :3001 y el túnel hacia :3002 cumplen funciones distintas.</tspan></text>
