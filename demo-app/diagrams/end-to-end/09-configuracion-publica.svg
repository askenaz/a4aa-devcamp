<text font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#AD6100"><tspan x="1123" y="677.0">GET client-metadata</tspan></text>
<path d="M 450 821 L 680 821" fill="none" stroke="#6850AD" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow6850AD)"/>
<text font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#6850AD"><tspan x="474" y="800.0">OAuth del CRM</tspan></text>
