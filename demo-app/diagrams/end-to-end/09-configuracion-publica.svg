<text font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#4B6178"><tspan x="92" y="724.0">Importación manual desde Dashboard</tspan></text>
<rect x="680" y="650" width="420" height="94" rx="12" fill="#FFFFFF" stroke="#D4E0EA" stroke-width="1.5"/>
<rect x="680" y="666" width="4" height="62" rx="2" fill="#AD6100" stroke="none" stroke-width="1.5"/>
<text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#142B43"><tspan x="700" y="692.0">URL pública HTTPS · MCP</tspan></text>
<text font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#4B6178"><tspan x="700" y="724.0">MCP_PUBLIC_URL → túnel a localhost:3001</tspan></text>
<rect x="1360" y="650" width="484" height="94" rx="12" fill="#FFFFFF" stroke="#D4E0EA" stroke-width="1.5"/>
<rect x="1360" y="666" width="4" height="62" rx="2" fill="#007C83" stroke="none" stroke-width="1.5"/>
<text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#142B43"><tspan x="1380" y="692.0">Nexus MCP server (:3001)</tspan></text>
<text font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#4B6178"><tspan x="1380" y="724.0">/.well-known/client-metadata · PRM</tspan></text>
<rect x="72" y="773" width="378" height="94" rx="12" fill="#FFFFFF" stroke="#D4E0EA" stroke-width="1.5"/>
<rect x="72" y="789" width="4" height="62" rx="2" fill="#6850AD" stroke="none" stroke-width="1.5"/>
<text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#142B43"><tspan x="92" y="815.0">Auth0 · conexión CRM</tspan></text>
<text font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#4B6178"><tspan x="92" y="847.0">Navegador: authorize · Auth0: token</tspan></text>
<rect x="680" y="773" width="420" height="94" rx="12" fill="#FFFFFF" stroke="#D4E0EA" stroke-width="1.5"/>
<rect x="680" y="789" width="4" height="62" rx="2" fill="#AD6100" stroke="none" stroke-width="1.5"/>
<text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#142B43"><tspan x="700" y="815.0">URL pública HTTPS · CRM</tspan></text>
<text font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#4B6178"><tspan x="700" y="847.0">Conexión Auth0 → túnel a localhost:3002</tspan></text>
<rect x="1360" y="773" width="484" height="94" rx="12" fill="#FFFFFF" stroke="#D4E0EA" stroke-width="1.5"/>
<rect x="1360" y="789" width="4" height="62" rx="2" fill="#007C83" stroke="none" stroke-width="1.5"/>
<text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#142B43"><tspan x="1380" y="815.0">Nexus CRM (:3002)</tspan></text>
<text font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#4B6178"><tspan x="1380" y="847.0">/crm/oauth/authorize · /crm/oauth/token</tspan></text>
<text font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#142B43"><tspan x="72" y="959.0">Si “Connect CRM” abre Codespaces, actualiza authorizationURL y tokenURL de la conexión en Auth0 para usar el túnel CRM.</tspan></text>
<text font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#4B6178"><tspan x="72" y="993.0">El client_id CIMD debe coincidir con la URL pública importada. Los redirect_uris de la SPA se configuran por separado.</tspan></text>
</svg>
