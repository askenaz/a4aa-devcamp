<text font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#2563A6"><tspan x="72" y="218.0">01  /  PROVISIONAMIENTO BAJO DEMANDA</tspan></text>
<text font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#4B6178"><tspan x="72" y="254.0">Se inicia al pulsar “Provision Resources”. Levantar el servidor no registra los recursos por sí solo.</tspan></text>
