<text font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#4B6178"><tspan x="92" y="396.0">Botón Provision Resources</tspan><tspan x="92" y="418.4">Proxy de Vite a /api</tspan></text>
<rect x="510" y="286" width="380" height="151" rx="12" fill="#FFFFFF" stroke="#D4E0EA" stroke-width="1.5"/>
<rect x="510" y="302" width="4" height="119" rx="2" fill="#2563A6" stroke="none" stroke-width="1.5"/>
<text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#142B43"><tspan x="530" y="328.0">Nexus API server</tspan></text>
<rect x="530" y="340" width="75" height="28" rx="7" fill="#E8F5F4" stroke="none" stroke-width="1.5"/>
<text font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#2563A6"><tspan x="540" y="358.0">:3000</tspan></text>
<text font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#4B6178"><tspan x="530" y="396.0">POST /api/setup/provision</tspan><tspan x="530" y="418.4">runProvision() + AUTH0_MGMT_*</tspan></text>
<rect x="1045" y="286" width="380" height="151" rx="12" fill="#FFFFFF" stroke="#D4E0EA" stroke-width="1.5"/>
<rect x="1045" y="302" width="4" height="119" rx="2" fill="#6850AD" stroke="none" stroke-width="1.5"/>
<text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#142B43"><tspan x="1065" y="328.0">Auth0 Management API</tspan></text>
<rect x="1065" y="340" width="75" height="28" rx="7" fill="#E8F5F4" stroke="none" stroke-width="1.5"/>
<text font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#6850AD"><tspan x="1075" y="358.0">:443</tspan></text>
<text font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#4B6178"><tspan x="1065" y="396.0">Token M2M · audiencia /api/v2/</tspan><tspan x="1065" y="418.4">APIs, apps, CRM, usuarios, rol y MFA</tspan></text>
<rect x="1510" y="286" width="335" height="151" rx="12" fill="#FFFFFF" stroke="#D4E0EA" stroke-width="1.5"/>
<rect x="1510" y="302" width="4" height="119" rx="2" fill="#2563A6" stroke="none" stroke-width="1.5"/>
